version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The `pip` ecosystem cannot read uv.lock; `uv` reads [project.dependencies]
  # and [dependency-groups] from pyproject.toml and updates the lock alongside.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
