[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aes_pkcs5"
version = "1.0.4"
description = "Implementation of AES with CBC/ECB mode and padding scheme PKCS5"
readme = {file = "README.rst", content-type = "text/x-rst"}
authors = [
    {name = "Laerte Pereira", email = "hi@laerte.dev"}
]
maintainers = [
    {name = "Laerte Pereira", email = "hi@laerte.dev"}
]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">= 3.10"
dependencies = [
    "cryptography >= 41.0.2"
]

[project.urls]
Homepage = "https://github.com/Laerte/aes_pkcs5"
Documentation = "https://aes-pkcs5.readthedocs.io"
Source = "https://github.com/Laerte/aes_pkcs5"
Tracker = "https://github.com/Laerte/aes_pkcs5/issues"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0"
]
# Sphinx 9.x requires Python >= 3.12; docs are only ever built on 3.13 (CI and RTD).
# The marker keeps the lock resolvable across the 3.10+ range the library supports.
docs = [
    "Sphinx>=9.1.0; python_version >= '3.12'",
    "sphinx-rtd-theme>=3.1.0; python_version >= '3.12'"
]
# Keep the ruff pin in sync with the rev in .pre-commit-config.yaml
lint = [
    "ruff==0.16.3"
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "lint"},
    "pre-commit>=4.4.0"
]

[tool.hatch.build.targets.sdist]
include = [
  "aes_pkcs5*",
]

[tool.hatch.build.targets.wheel]
packages = ["aes_pkcs5"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "E501",  # line length is the formatter's job; only unsplittable strings remain
]

[tool.ruff.lint.isort]
known-first-party = ["aes_pkcs5", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["aes_pkcs5"]

[tool.coverage.report]
exclude_also = ["@(abc\\.)?abstractmethod"]
